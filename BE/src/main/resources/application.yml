spring:
  application:
    name: ddemachim-server

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-time: ${JWT_ACCESS_TOKEN_EXPIRE_TIME:3600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

ddemachim:
  kakao:
    local:
      rest-api-key: ${KAKAO_REST_API_KEY:}
      base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
  tmap:
    base-url: ${TMAP_BASE_URL:https://apis.openapi.sk.com}
    app-key: ${TMAP_APP_KEY:}
    connect-timeout: 2s
    read-timeout: 4s
    cache-ttl: 2m
    cache-maximum-size: 1000
