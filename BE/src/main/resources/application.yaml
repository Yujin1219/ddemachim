spring:
  application:
    name: server

  datasource:
    url: jdbc:postgresql://localhost:5432/ddemachim
    username: postgres
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

ddemachim:
  data-pipeline:
    scheduler:
      enabled: true
      working-directory: /Users /yujin/Project/ddemachim/data-pipeline
      timeout: 30m
      zone: Asia/Seoul

      tour-api-events:
        script: scripts/run_events.py
        cron: "0 0 6 ? * MON"

      seoul-culture-events:
        script: scripts/run_seoul_culture_event.py
        cron: "0 10 6 ? * MON"

      repeated-blog-trend:
        script: scripts/repeated_blog_trend.py
        cron: "0 30 4 ? * MON"

  odsay:
    base-url: https://api.odsay.com
    api-key: ${ODSAY_API_KEY}
    connect-timeout: 2s
    read-timeout: 4s

  tmap:
    base-url: https://apis.openapi.sk.com
    app-key: ${TMAP_APP_KEY}
    connect-timeout: 2s
    read-timeout: 4s
    cache-ttl: 2m
    cache-maximum-size: 1000

  citydata:
    seoul:
      enabled: true
      api-key: ${SEOUL_CITYDATA_API_KEY}
      base-url: http://openapi.seoul.go.kr:8088
      refresh-delay-millis: 300000
      stale-after: 10m

  kakao:
    local:
      rest-api-key: ${KAKAO_REST_API_KEY}
      base-url: https://dapi.kakao.com

  crowding:
    mock:
      enabled: true
      seed: ${MOCK_CROWDING_SEED:ddemachim-demo-v1}
      ttl: 24h
      zone: Asia/Seoul
      maximum-viewport-grids: 5000
      maximum-batch-points: 300

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-time: 1209600000

cors:
  allowed-origins:
    - http://localhost:5173