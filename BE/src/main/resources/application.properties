spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:2s}

ddemachim.crowding.mock.seed=${MOCK_CROWDING_SEED:ddemachim-demo-v1}
ddemachim.crowding.mock.ttl=24h
ddemachim.crowding.mock.zone=Asia/Seoul
ddemachim.crowding.mock.maximum-viewport-grids=5000
ddemachim.crowding.mock.maximum-batch-points=300
