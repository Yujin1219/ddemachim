services:
  web:
    image: ${WEB_IMAGE:-ddemachim-web:vm-amd64}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:80"
    environment:
      BACKEND_UPSTREAM: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks: [web]
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE:-ddemachim-backend:vm-amd64}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ddemachim
      SPRING_DATASOURCE_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the private env file}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the private env file}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?Set KAKAO_REST_API_KEY}
      TMAP_APP_KEY: ${TMAP_APP_KEY:?Set TMAP_APP_KEY}
      ODSAY_API_KEY: ${ODSAY_API_KEY:?Set ODSAY_API_KEY}
      AI_GUIDE_ENABLED: ${AI_GUIDE_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      SEOUL_CITYDATA_ENABLED: ${SEOUL_CITYDATA_ENABLED:-false}
      SEOUL_CITYDATA_API_KEY: ${SEOUL_CITYDATA_API_KEY:-}
      DATA_PIPELINE_SCHEDULER_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the browser origin}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx512m -Duser.timezone=Asia/Seoul}
    healthcheck:
      # TCP readiness only; the integration test also exercises real HTTP/DB APIs.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      start_period: 90s
      retries: 6
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [web, data]
    logging: *logging

  db:
    image: ${DB_IMAGE:-postgis/postgis:18-3.6}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ddemachim
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the private env file}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ddemachim"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks: [data]
    logging: *logging

  redis:
    image: redis:8.8.0-alpine
    platform: linux/amd64
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]
    logging: *logging

networks:
  web:
  data:
    internal: true

volumes:
  db-data:
  redis-data:
