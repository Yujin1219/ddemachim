    <g transform="translate(284 102)"><ellipse cx="58" cy="14" rx="58" ry="14" fill="#2E6098"/><rect y="14" width="116" height="44" fill="#173A68"/><ellipse cx="58" cy="58" rx="58" ry="14" fill="#102E55"/><text x="58" y="41" class="db center">트렌드·원천</text></g>
