<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">때마침 서비스 구성도</title>
  <desc id="desc">이용자, 공통자원, 데이터 및 제어, 연계기관, 외부 시스템 연계 API로 구성된 때마침 서비스 구성도</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9DBFF"/><stop offset="0.58" stop-color="#8EC4F7"/><stop offset="1" stop-color="#6AA7E8"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCEEFF" stop-opacity="0.68"/><stop offset="1" stop-color="#C4E0FA" stop-opacity="0.58"/></linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F8FCFF"/><stop offset="1" stop-color="#EAF5FF"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#74BEFF"/><stop offset="1" stop-color="#3D88EA"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B3768" flood-opacity="0.13"/></filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M1 1L12 6.5L1 12Z" fill="#FFFFFF"/></marker>
    <style>
      text { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #102B50; }
      .group-title { font-size: 31px; font-weight: 800; letter-spacing: -1px; }
      .box-title { font-size: 25px; font-weight: 800; letter-spacing: -0.8px; }
      .item-title { font-size: 18px; font-weight: 800; }
      .body { font-size: 16px; font-weight: 600; }
      .body-sm { font-size: 14px; font-weight: 600; }
      .agency { font-size: 20px; font-weight: 750; }
      .db { font-size: 15px; font-weight: 750; fill: #FFFFFF; }
      .api { font-size: 19px; font-weight: 800; }
      .api-sub { font-size: 12px; font-weight: 650; fill: #5C7694; }
      .center { text-anchor: middle; }
    </style>
  </defs>

